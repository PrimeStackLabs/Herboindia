<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="100%" height="100%">
  <defs>
    <!-- Royal Medical Blue Stadium Capsule Gradient -->
    <linearGradient id="royalBlueBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f42f5"/>
      <stop offset="50%" stop-color="#183bd8"/>
      <stop offset="100%" stop-color="#112caa"/>
    </linearGradient>

    <!-- Royal Medical Blue Ambient Glow inside Capsule -->
    <radialGradient id="royalBlueGlow" cx="42%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3b62ff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#112caa" stop-opacity="0"/>
    </radialGradient>

    <!-- Rich Metallic Gold Gradient for Tree & Typography -->
    <linearGradient id="goldLuxuryGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#9a7424"/>
      <stop offset="20%" stop-color="#cca343"/>
      <stop offset="42%" stop-color="#f5e18c"/>
      <stop offset="60%" stop-color="#dfbb53"/>
      <stop offset="82%" stop-color="#b48726"/>
      <stop offset="100%" stop-color="#7c5512"/>
    </linearGradient>

    <!-- Warm Amber Gold for highlights -->
    <linearGradient id="goldLightGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c99e38"/>
      <stop offset="50%" stop-color="#fdf3b4"/>
      <stop offset="100%" stop-color="#d6ab42"/>
    </linearGradient>

    <!-- Soft Sage/Jade Green for India Map Silhouette -->
    <linearGradient id="jadeMapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9bbfa8"/>
      <stop offset="50%" stop-color="#7ea78e"/>
      <stop offset="100%" stop-color="#557e65"/>
    </linearGradient>

    <!-- Forest Herbal Green for Botanical Accents -->
    <linearGradient id="forestHerbalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a4f"/>
      <stop offset="50%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#081c15"/>
    </linearGradient>

    <!-- Drop Shadow for 3D metallic depth -->
    <filter id="logoDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#07124a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ==================== ROYAL BLUE BACKGROUND CAPSULE ==================== -->
  <g filter="url(#logoDepth)">
    <rect x="3" y="4" width="554" height="132" rx="66" fill="url(#royalBlueBg)"/>
    <rect x="3" y="4" width="554" height="132" rx="66" fill="url(#royalBlueGlow)"/>
    <!-- Luxury Gold Foil Perimeter Border -->
    <rect x="4.5" y="5.5" width="551" height="129" rx="64.5" fill="none" stroke="url(#goldLuxuryGrad)" stroke-width="2.5" opacity="0.9"/>
    <rect x="7.5" y="8.5" width="545" height="123" rx="61.5" fill="none" stroke="url(#goldLightGrad)" stroke-width="1" opacity="0.35"/>
  </g>

  <!-- ==================== LEFT EMBLEM: SACRED TREE OF LIFE & INDIA MAP ==================== -->
  <g transform="translate(20, 5)" filter="url(#logoDepth)">
    <!-- Outer Circular Ring (Gold Foil with Double Border) -->
    <circle cx="65" cy="65" r="54" fill="none" stroke="url(#goldLuxuryGrad)" stroke-width="4.2"/>
    <circle cx="65" cy="65" r="49" fill="none" stroke="url(#goldLightGrad)" stroke-width="1.2" opacity="0.65"/>

    <!-- Silhouette of India Map (Soft Sage/Jade Green in Right-Center of Medallion) -->
    <g transform="translate(72, 38) scale(0.42)" opacity="0.95">
      <path d="M 45,5 
               C 52,2 58,12 62,20 
               C 68,22 75,18 80,24 
               C 85,30 92,34 90,42 
               C 88,48 95,52 98,58 
               C 102,64 110,65 115,70 
               C 120,78 116,85 110,88 
               C 105,92 98,90 94,94 
               C 90,98 84,102 78,105 
               C 74,115 70,125 64,135 
               C 58,145 52,155 48,162 
               C 44,152 40,140 36,130 
               C 32,120 28,112 25,102 
               C 22,96 15,92 12,85 
               C 8,78 4,72 6,65 
               C 8,58 14,54 18,48 
               C 22,44 26,38 30,30 
               C 34,22 38,12 45,5 Z" 
            fill="url(#jadeMapGrad)"/>
    </g>

    <!-- Tree of Life Trunk & Sinuous Spreading Branches (Metallic Gold) -->
    <g stroke="url(#goldLuxuryGrad)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 62,94 C 58,102 50,108 42,114 M 52,108 C 45,114 38,118 32,120" stroke-width="3"/>
      <path d="M 65,96 C 65,104 62,112 58,120 M 62,110 C 60,116 58,122 56,124" stroke-width="2.5"/>
      <path d="M 68,96 C 72,104 78,110 86,116 M 75,108 C 82,114 90,118 96,120" stroke-width="3"/>
      <path d="M 66,96 C 68,104 70,114 72,122" stroke-width="2.2"/>
    </g>

    <!-- Solid Sculpted Trunk -->
    <path d="M 52,94 
             C 55,84 56,76 54,66 
             C 52,56 46,48 40,40 
             C 44,42 50,48 54,54 
             C 58,46 64,36 72,28 
             C 68,36 66,45 66,54 
             C 70,48 76,42 84,36 
             C 80,44 76,52 74,62 
             C 78,58 84,56 90,54 
             C 84,62 80,68 76,74 
             C 74,82 76,88 78,94 
             C 72,92 68,90 65,90 
             C 62,90 58,92 52,94 Z" 
          fill="url(#goldLuxuryGrad)"/>

    <!-- Left & Right Arching Golden Branches -->
    <path d="M 54,66 C 44,60 36,64 28,72 C 34,64 42,58 52,60" fill="url(#goldLuxuryGrad)"/>
    <path d="M 54,54 C 42,46 32,50 24,58 C 30,50 40,44 50,48" fill="url(#goldLuxuryGrad)"/>
    <path d="M 66,54 C 74,44 86,40 98,40 C 88,44 78,50 70,58" fill="url(#goldLuxuryGrad)"/>
    <path d="M 64,40 C 60,30 52,24 42,20 C 50,22 58,28 62,36" fill="url(#goldLuxuryGrad)"/>
    <path d="M 68,34 C 74,26 84,22 94,22 C 86,26 78,32 72,38" fill="url(#goldLuxuryGrad)"/>

    <!-- Canopy Leaves (Gold Foil & Herbal Jade accents) -->
    <path d="M 65,16 C 60,20 60,26 65,30 C 70,26 70,20 65,16 Z" fill="url(#goldLightGrad)"/>
    <path d="M 55,20 C 50,23 48,28 52,32 C 57,30 58,24 55,20 Z" fill="url(#goldLightGrad)"/>
    <path d="M 75,20 C 80,23 82,28 78,32 C 73,30 72,24 75,20 Z" fill="url(#goldLightGrad)"/>
    
    <path d="M 44,23 C 38,25 36,31 40,35 C 45,33 46,27 44,23 Z" fill="url(#goldLightGrad)"/>
    <path d="M 34,28 C 28,31 27,37 31,41 C 36,39 37,33 34,28 Z" fill="url(#goldLightGrad)"/>
    <path d="M 26,38 C 20,41 20,48 25,51 C 29,48 30,42 26,38 Z" fill="url(#goldLightGrad)"/>
    <path d="M 22,50 C 16,54 17,61 22,63 C 26,60 26,53 22,50 Z" fill="url(#goldLightGrad)"/>
    <path d="M 22,64 C 17,68 18,75 24,77 C 27,73 26,67 22,64 Z" fill="url(#goldLightGrad)"/>

    <path d="M 32,74 C 24,76 22,85 28,90 C 35,88 36,80 32,74 Z" fill="url(#jadeMapGrad)"/>
    <path d="M 38,82 C 32,86 32,94 38,98 C 44,95 44,88 38,82 Z" fill="url(#forestHerbalGrad)"/>

    <path d="M 86,23 C 92,25 94,31 90,35 C 85,33 84,27 86,23 Z" fill="url(#goldLightGrad)"/>
    <path d="M 96,28 C 102,31 103,37 99,41 C 94,39 93,33 96,28 Z" fill="url(#goldLightGrad)"/>
    <path d="M 104,38 C 110,41 110,48 105,51 C 101,48 100,42 104,38 Z" fill="url(#goldLightGrad)"/>
    <path d="M 106,52 C 112,56 111,63 106,65 C 102,62 102,55 106,52 Z" fill="url(#goldLightGrad)"/>
    <path d="M 104,66 C 109,70 108,77 102,79 C 99,75 100,69 104,66 Z" fill="url(#goldLightGrad)"/>
    <path d="M 96,78 C 101,83 99,90 93,92 C 90,88 91,82 96,78 Z" fill="url(#jadeMapGrad)"/>
  </g>

  <!-- ==================== RIGHT TYPOGRAPHY: HERBO INDIA & NATURAL WELLNESS ==================== -->
  <g transform="translate(148, 12)">
    <!-- Brand Title: HERBO INDIA (Sculpted Luxury Display Serif in Gold Foil) -->
    <text x="0" y="65" 
          font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
          font-size="44" 
          font-weight="900" 
          fill="url(#goldLuxuryGrad)" 
          letter-spacing="2"
          filter="url(#logoDepth)">HERBO INDIA</text>

    <!-- Elegant Center Flourish Divider Line with Leaf Accent -->
    <g transform="translate(0, 80)">
      <path d="M 2,0 L 175,0" stroke="url(#goldLuxuryGrad)" stroke-width="1.8" stroke-linecap="round"/>
      <g transform="translate(196, 0)">
        <path d="M 0,0 C -6,-5 -12,-3 -14,1 C -10,4 -4,3 0,0 Z" fill="url(#goldLightGrad)"/>
        <path d="M 0,0 C 6,-5 12,-3 14,1 C 10,4 4,3 0,0 Z" fill="url(#forestHerbalGrad)"/>
        <circle cx="0" cy="0" r="2.2" fill="url(#goldLightGrad)"/>
      </g>
      <path d="M 217,0 L 390,0" stroke="url(#goldLuxuryGrad)" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Subtitle: NATURAL WELLNESS (Metallic Gold) -->
    <text x="196" y="104" 
          text-anchor="middle"
          font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" 
          font-size="14.5" 
          font-weight="800" 
          fill="url(#goldLuxuryGrad)" 
          letter-spacing="6.5">NATURAL WELLNESS</text>
  </g>
</svg>