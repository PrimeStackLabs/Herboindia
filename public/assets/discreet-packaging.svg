<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <!-- Background Radiant Gradients (Royal Midnight & Soft Sapphire Glow) -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="1"/>
    </radialGradient>

    <!-- Parcel Box Gradients -->
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a323d"/>
      <stop offset="40%" stop-color="#1e2631"/>
      <stop offset="100%" stop-color="#131a22"/>
    </linearGradient>

    <linearGradient id="boxTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d4957"/>
      <stop offset="100%" stop-color="#4d5b6c"/>
    </linearGradient>

    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a212b"/>
      <stop offset="100%" stop-color="#0d131a"/>
    </linearGradient>

    <!-- Gold Foil Luxury Ribbon Accents -->
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Royal Medical Blue Security Gradient -->
    <linearGradient id="blueSecurity" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#4353ff"/>
      <stop offset="100%" stop-color="#2a38cb"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="boxShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>

    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#4353ff" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="700" height="420" rx="24" fill="url(#bgGlow)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="120" r="140" fill="#4353ff" opacity="0.16" filter="url(#boxShadow)"/>
  <circle cx="560" cy="280" r="160" fill="#f59e0b" opacity="0.12" filter="url(#boxShadow)"/>
  <circle cx="350" cy="210" r="180" fill="#4353ff" opacity="0.08"/>

  <!-- Subtle Security Pattern Grid Lines -->
  <g stroke="#4353ff" stroke-opacity="0.1" stroke-width="1">
    <line x1="40" y1="70" x2="660" y2="70"/>
    <line x1="40" y1="140" x2="660" y2="140"/>
    <line x1="40" y1="210" x2="660" y2="210"/>
    <line x1="40" y1="280" x2="660" y2="280"/>
    <line x1="40" y1="350" x2="660" y2="350"/>
  </g>

  <!-- ==================== 3D LUXURY DISCREET PARCEL ==================== -->
  <g transform="translate(190, 80)" filter="url(#boxShadow)">
    <!-- Floor Shadow -->
    <ellipse cx="140" cy="245" rx="170" ry="26" fill="#000000" opacity="0.45"/>

    <!-- Left / Front Face of 3D Package -->
    <path d="M 30,110 L 160,185 L 160,250 L 30,175 Z" fill="url(#boxSide)"/>

    <!-- Main Front Face (Isometric Angle) -->
    <path d="M 160,185 L 290,110 L 290,175 L 160,250 Z" fill="url(#boxFront)"/>

    <!-- Top Lid Face -->
    <path d="M 30,110 L 160,35 L 290,110 L 160,185 Z" fill="url(#boxTop)"/>

    <!-- Security Tamper-Evident Tape / Golden Ribbon across Top & Front -->
    <path d="M 148,42 L 172,28 L 172,178 L 148,192 Z" fill="url(#goldLuxury)" opacity="0.95"/>
    <path d="M 148,192 L 172,178 L 172,243 L 148,257 Z" fill="url(#goldLuxury)" opacity="0.95"/>

    <!-- Golden Lock Seal Medallion in Center of Tape -->
    <g transform="translate(160, 150)" filter="url(#goldGlow)">
      <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="url(#goldLuxury)" stroke-width="3"/>
      <circle cx="0" cy="0" r="23" fill="url(#goldLuxury)"/>
      <circle cx="0" cy="0" r="19" fill="#0f172a"/>
      <!-- Padlock Icon inside medallion -->
      <path d="M -6, -2 L 6, -2 A 6 6 0 0 1 6, -8 A 6 6 0 0 0 -6, -8 Z" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="-8" y="-2" width="16" height="12" rx="3" fill="url(#goldLuxury)"/>
      <circle cx="0" cy="4" r="1.8" fill="#0f172a"/>
    </g>

    <!-- Generic Logistics Label (Strictly No Medical or Sexual Words) -->
    <g transform="translate(182, 126) rotate(30, 0, 0)">
      <rect x="0" y="0" width="85" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Barcode Lines -->
      <line x1="8" y1="8" x2="8" y2="28" stroke="#1e293b" stroke-width="2"/>
      <line x1="13" y1="8" x2="13" y2="28" stroke="#1e293b" stroke-width="1"/>
      <line x1="17" y1="8" x2="17" y2="28" stroke="#1e293b" stroke-width="3"/>
      <line x1="23" y1="8" x2="23" y2="28" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="28" y1="8" x2="28" y2="28" stroke="#1e293b" stroke-width="2.5"/>
      <line x1="34" y1="8" x2="34" y2="28" stroke="#1e293b" stroke-width="1"/>
      <line x1="39" y1="8" x2="39" y2="28" stroke="#1e293b" stroke-width="3"/>
      <line x1="46" y1="8" x2="46" y2="28" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="52" y1="8" x2="52" y2="28" stroke="#1e293b" stroke-width="2"/>
      <line x1="58" y1="8" x2="58" y2="28" stroke="#1e293b" stroke-width="1"/>
      <line x1="64" y1="8" x2="64" y2="28" stroke="#1e293b" stroke-width="2.5"/>
      <line x1="72" y1="8" x2="72" y2="28" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="77" y1="8" x2="77" y2="28" stroke="#1e293b" stroke-width="2"/>

      <!-- Text on Label -->
      <text x="8" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" font-weight="800" fill="#0f172a">EXPRESS PRIORITY HUB</text>
      <text x="8" y="46" font-family="monospace" font-size="4.8" font-weight="700" fill="#64748b">AWB: HI-9920-COD</text>
    </g>

    <!-- Blue Hologram Quality Seal on Top -->
    <g transform="translate(90, 85) rotate(-30, 0, 0)">
      <polygon points="18,0 36,9 36,27 18,36 0,27 0,9" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="18" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="900" fill="#bfdbfe" text-anchor="middle">SEALED</text>
      <text x="18" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="4" font-weight="700" fill="#ffffff" text-anchor="middle">PRIVATE</text>
    </g>
  </g>

  <!-- ==================== FLOATING TRUST PILLS AROUND PARCEL ==================== -->
  
  <!-- Pill 1: Top Left - 100% Confidential Seal -->
  <g transform="translate(45, 55)" filter="url(#blueGlow)">
    <rect width="210" height="48" rx="24" fill="#0f172a" stroke="#4353ff" stroke-width="1.8"/>
    <circle cx="25" cy="24" r="14" fill="#1e293b"/>
    <text x="25" y="29" font-size="14" text-anchor="middle">🔒</text>
    <text x="48" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#60a5fa" letter-spacing="0.5">100% PRIVATE &amp; SECURE</text>
    <text x="48" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#cbd5e1">Zero Medical Names on Box</text>
  </g>

  <!-- Pill 2: Bottom Left - Tamper Evident Guarantee -->
  <g transform="translate(40, 310)" filter="url(#goldGlow)">
    <rect width="220" height="48" rx="24" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8"/>
    <circle cx="25" cy="24" r="14" fill="#78350f"/>
    <text x="25" y="29" font-size="14" text-anchor="middle">✨</text>
    <text x="48" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#fde047" letter-spacing="0.5">PREMIUM LUXURY WRAP</text>
    <text x="48" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#fef3c7">Opaque &amp; Waterproof Shield</text>
  </g>

  <!-- Pill 3: Top Right - Cash on Delivery (COD) -->
  <g transform="translate(440, 55)" filter="url(#goldGlow)">
    <rect width="215" height="48" rx="24" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8"/>
    <circle cx="25" cy="24" r="14" fill="#78350f"/>
    <text x="25" y="29" font-size="14" text-anchor="middle">💵</text>
    <text x="48" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#fde047" letter-spacing="0.5">DOORSTEP CASH ON DELIVERY</text>
    <text x="48" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#fef3c7">Pay Only When in Hands</text>
  </g>

  <!-- Pill 4: Bottom Right - Discreet Courier Hub -->
  <g transform="translate(440, 310)" filter="url(#blueGlow)">
    <rect width="215" height="48" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="25" cy="24" r="14" fill="#0369a1"/>
    <text x="25" y="29" font-size="14" text-anchor="middle">🛡️</text>
    <text x="48" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#38bdf8" letter-spacing="0.5">NEUTRAL SENDER LOGISTICS</text>
    <text x="48" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#e2e8f0">No Delivery Knowledge</text>
  </g>

  <!-- Bottom Centered Trust Banner -->
  <g transform="translate(190, 375)">
    <rect width="320" height="28" rx="14" fill="rgba(67, 83, 255, 0.28)" stroke="rgba(96, 165, 250, 0.45)" stroke-width="1"/>
    <text x="160" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#bfdbfe" text-anchor="middle">
      ✓ Over 48,000+ Men Delivered With 100% Zero-Embarrassment Privacy
    </text>
  </g>
</svg>